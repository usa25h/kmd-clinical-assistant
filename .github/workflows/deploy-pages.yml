name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'kmd-clinical-assistant/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmd-clinical-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kmd-clinical-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npx expo install react-dom react-native-web

      - name: Build web
        run: npx expo export --platform web
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kmd-app --commit-dirty=true
